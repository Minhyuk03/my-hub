<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>나의 허브 — 연결 안 됨</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, system-ui, sans-serif; background: #fff; color: #111; padding: 16px; }
  @media (prefers-color-scheme: dark) { body { background: #0a0a0a; color: #eee; } }
  main { max-width: 360px; text-align: center; }
  p { color: #888; line-height: 1.6; }
  button { margin-top: 12px; padding: 8px 16px; border-radius: 8px; border: 1px solid #888; background: transparent; color: inherit; font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1>허브에 연결할 수 없습니다</h1>
  <p>이 기기에서 Tailscale 이 켜져 있는지, Mac mini 가 켜져 있는지 확인하세요.</p>
  <button onclick="location.reload()">다시 시도</button>
</main>
</body>
</html>
